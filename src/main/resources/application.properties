quarkus.http.host=0.0.0.0
quarkus.http.port=9000
quarkus.log.level=${QUARKUS_LOG_LEVEL:INFO}

quarkus.generate-code.grpc.scan-for-proto=gg.grounds:library-grpc-contracts-match

quarkus.datasource.db-kind=postgresql
# Names this service's connections in pg_stat_activity and PgBouncer SHOW CLIENTS.
quarkus.datasource.jdbc.additional-jdbc-properties.ApplicationName=service-match
quarkus.datasource.jdbc.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/app?currentSchema=match}
quarkus.datasource.username=${POSTGRES_USER:app}
quarkus.datasource.password=${POSTGRES_PASSWORD:app}
# Agroal pool gauges on /q/metrics: agroal_active_count, agroal_available_count,
# agroal_awaiting_count. This is the signal that a pool is running out — without
# it, exhaustion only shows up as services crash-looping at startup.
# BUILD_AND_RUN_TIME_FIXED: it cannot be switched on with an env var later.
quarkus.datasource.jdbc.metrics.enabled=true

quarkus.flyway.schemas=match
quarkus.flyway.migrate-at-start=true
quarkus.flyway.create-schemas=true

# In prod, POSTGRES_URL may point at PgBouncer in transaction mode, which
# Flyway's session-level SETs and locks do not survive. Flyway runs on its own
# datasource straight to the primary instead (POSTGRES_DIRECT_URL, app-db-rw),
# and falls back to POSTGRES_URL where no direct URL is set.
%prod.quarkus.datasource.migrations.db-kind=postgresql
%prod.quarkus.datasource.migrations.jdbc.url=${POSTGRES_DIRECT_URL:${POSTGRES_URL}}
%prod.quarkus.datasource.migrations.username=${POSTGRES_USER}
%prod.quarkus.datasource.migrations.password=${POSTGRES_PASSWORD}
%prod.quarkus.datasource.migrations.jdbc.min-size=0
%prod.quarkus.datasource.migrations.jdbc.max-size=2
%prod.quarkus.datasource.migrations.jdbc.additional-jdbc-properties.ApplicationName=service-match-migrations
%prod.quarkus.datasource.migrations.health-exclude=true
%prod.quarkus.flyway.migrate-at-start=false
%prod.quarkus.flyway.migrations.schemas=match
%prod.quarkus.flyway.migrations.create-schemas=true
%prod.quarkus.flyway.migrations.migrate-at-start=true

# Weng-Lin (OpenSkill) rating defaults. sigma = mu/3 is the OpenSkill
# convention for "no information yet"; the display rating is the
# conservative mu - 3*sigma, so a fresh player shows 0 and climbs as
# the model gets certain about them.
grounds.match.rating.default-mu=${MATCH_RATING_DEFAULT_MU:25.0}
grounds.match.rating.default-sigma=${MATCH_RATING_DEFAULT_SIGMA:8.333333333333334}

# Valkey — the queue spine. Tickets, queues, the one-live-ticket guard, the
# in-flight match journal and the allocation stream all live here, and the Lua
# scripts Valkey serialises are what make the matchmaker correct.
quarkus.redis.hosts=${VALKEY_URL:redis://localhost:6379}
# The HTTP API's connections. Every command holds one for its round trip, and a
# caller that finds all of them busy waits in a bounded line; past that it gets
# a 503 straight away (see ValkeyBusyMapper) instead of piling up. The client's
# defaults (6 connections, 24 waiting) are what a few hundred leaves a second
# ran out of in a load test.
quarkus.redis.max-pool-size=${VALKEY_POOL_SIZE:32}
quarkus.redis.max-pool-waiting=${VALKEY_POOL_WAITING:256}

# The matchmaker's own client (see Matchmaker): the matcher tick, the allocation
# pump, the watchdog and the mode registry, so an API storm cannot starve them.
# Each of those runs one pass at a time, so a few connections are plenty.
quarkus.redis.matchmaker.hosts=${quarkus.redis.hosts}
quarkus.redis.matchmaker.max-pool-size=${VALKEY_MATCHMAKER_POOL_SIZE:6}
quarkus.redis.matchmaker.max-pool-waiting=${VALKEY_MATCHMAKER_POOL_WAITING:64}

# Queue tick. The band widens with waiting time, so the matcher must be
# timer-driven — an event-driven loop could never widen a band.
grounds.match.tick=${MATCH_TICK:2s}

# TTLs are garbage collection, not liveness: a ticket is finished when its state
# says so, not when it expires.
grounds.match.ticket.ttl-seconds=${MATCH_TICKET_TTL:21600}
grounds.match.match.ttl-seconds=${MATCH_MATCH_TTL:86400}

# How long a player who dropped off the network is still offered their running
# match when they log back in, through any proxy.
grounds.match.rejoin.grace-seconds=${MATCH_REJOIN_GRACE:60}

# Allocation. Agones runs in this same cluster, so the allocator talks to the
# local apiserver with the pod's own ServiceAccount.
grounds.match.agones.namespace=${AGONES_NAMESPACE:default}

# How to reach an allocated server. Our fleets run portPolicy: None, so Agones
# does no port management for them: status.ports is empty and status.address is
# the NODE's. The pod is what we must reach, and its address is the PodIP entry
# in status.addresses — the very entry plugin-agones registers proxy backends
# by, so the matchmaker and the proxy agree on what "the server" means. The port
# is fixed for the same reason: there is no allocated port to read.
grounds.match.agones.address-type=${AGONES_ADDRESS_TYPE:PodIP}
grounds.match.agones.port=${AGONES_PORT:25565}

# The match push (MatchHost/StartMatch), over NATS request-reply. The server is
# addressed by its own name — `<prefix>.<gameServerName>.start` — so the
# matchmaker no longer has to know where the pod is. Our fleets run
# portPolicy: None, so there was never a Service or a DNS name to use, and the
# old route read the PodIP off the GameServer status and dialled a second
# container port on it.
#
# The deadline is short on purpose: this call sits between "match formed" and
# "players routed", and a server that cannot answer promptly is one the players
# should not be sent to.
grounds.match.gameserver.subject-prefix=${GAMESERVER_SUBJECT_PREFIX:match.host}
grounds.match.gameserver.deadline-ms=${GAMESERVER_DEADLINE_MS:5000}

# NATS. The satellite leaf runs a Service in every game cluster and asks for no
# credentials; the token below is what the forge-provisioned dev broker wants,
# and is simply ignored on stage.
nats.url=${NATS_URL:nats://nats.nats.svc.cluster.local:4222}
nats.max-reconnects=${NATS_MAX_RECONNECTS:-1}
nats.reconnect-wait-seconds=${NATS_RECONNECT_WAIT_SECONDS:2}
grounds.token-file=${GROUNDS_TOKEN_FILE:/var/run/secrets/grounds/token}

grounds.match.alloc.poll=${ALLOC_POLL:1s}

# Fences concurrent allocation attempts for one match. It does NOT make
# allocation idempotent — nothing can, GameServerAllocation is a
# non-idempotent create — it only stops two workers POSTing at the same moment.
grounds.match.alloc.lease-ms=${ALLOC_LEASE_MS:30000}
grounds.match.alloc.max-attempts=${ALLOC_MAX_ATTEMPTS:3}

# How long a pending stream entry may idle before another worker takes it over.
# This is the dead-replica takeover, and it runs continuously rather than only
# at boot.
grounds.match.alloc.idle-reclaim-ms=${ALLOC_IDLE_RECLAIM_MS:60000}

# A Minestom server hosts many matches at once, so there is no GameServer reaper:
# deleting "the orphan's server" would throw every other game on it out mid-fight.
# What is left is narrower — a match that was claimed but whose server never took
# it. Those players are put back on the queue.
grounds.match.watchdog.every=${WATCHDOG_EVERY:30s}
grounds.match.watchdog.stale-after-ms=${WATCHDOG_STALE_AFTER_MS:120000}

# Round preparation. A server that answers StartMatch with signals_ready keeps
# the players in the queue (tickets PREPARING) until it reports the round ready
# on POST /v1/match/matches/{id}/ready. One that has not within the timeout is
# not going to: its players go back on the queue and it is told to drop the
# round on `<subject-prefix>.<gameServerName>.cancel`. The sweep runs often so
# the timeout holds to within a few seconds.
grounds.match.prepare.timeout-ms=${MATCH_PREPARE_TIMEOUT_MS:20000}
grounds.match.prepare.sweep-every=${MATCH_PREPARE_SWEEP_EVERY:5s}

# Map pools. A mode registered with `maps: {namespace}` plays the maps pinned
# for this environment under `<namespace>/`, read from the same CDN pin file the
# game servers load maps by. Cached; a failed read keeps the last good copy.
grounds.match.maps.cdn-base=${MAPS_CDN_BASE:https://maps.grounds.gg}
grounds.match.maps.environment=${MAPS_ENVIRONMENT:stage}
grounds.match.maps.cache-seconds=${MAPS_CACHE_SECONDS:60}
grounds.match.maps.fetch-timeout-ms=${MAPS_FETCH_TIMEOUT_MS:3000}

# JWT validation — verifies every incoming gRPC call's Bearer token
# against the k8s API-server's JWKS endpoint. Audience binds the
# token to this service class.
#
# In-cluster: kubernetes.default.svc resolves correctly. Disable
# (set grounds.auth.enabled=false) for local dev where there's no
# projected SA-Token volume to attach.
grounds.auth.enabled=${GROUNDS_AUTH_ENABLED:true}
grounds.auth.jwks-url=${GROUNDS_AUTH_JWKS_URL:https://kubernetes.default.svc/openid/v1/jwks}
grounds.auth.expected-audience=${GROUNDS_AUTH_AUDIENCE:grounds-services}
grounds.auth.k8s-ca-file=${GROUNDS_AUTH_K8S_CA_FILE:/var/run/secrets/kubernetes.io/serviceaccount/ca.crt}
grounds.auth.k8s-token-file=${GROUNDS_AUTH_K8S_TOKEN_FILE:/var/run/secrets/kubernetes.io/serviceaccount/token}

# service-leaderboard — POSTs a rated result's post-match conservative skill
# (mu - 3*sigma) to the mode's board. Plain HTTP: pod-to-pod inside the project's
# own vCluster, and the URL arrives with no scheme. A leaderboard failure is logged and
# swallowed by LeaderboardClient — the match result is already committed to
# Postgres by the time this is called, and is the source of truth regardless.
grounds.match.leaderboard.url=${LEADERBOARD_SERVICE_URL:service-leaderboard:9000}
grounds.match.leaderboard.deadline-ms=${LEADERBOARD_DEADLINE_MS:5000}
# `http` (above) or `jetstream`: publish the same body to the LEADERBOARD_SCORES
# stream (`leaderboard.score.submitted.<mode>`), which service-leaderboard
# consumes. The core writer uses jetstream; it has no route to a regional
# service-leaderboard.
grounds.match.leaderboard.transport=${MATCH_LEADERBOARD_TRANSPORT:http}

# Which half of the service this process is: `all`, the regional runtime
# (queue, matcher, allocator, HTTP API), or `writer`, the same image in core
# that only applies results from the MATCH_RESULTS stream. See MatchRole.
grounds.match.role=${MATCH_ROLE:all}

# Asynchronous results. On, POST /matches/{id}/result checks the result against
# the match record, clears the players' active match and publishes it to the
# region's in-memory JetStream buffer (`match.result.submitted.<mode>`), which
# the hub's MATCH_RESULTS stream sources; the core writer applies it within
# seconds. The answer stays 200 with `queued: true`. A publish that is not
# acknowledged within the timeout (no buffer, no broker, buffer full) is applied
# synchronously instead, as with this off.
grounds.match.result.async=${MATCH_RESULT_ASYNC:false}
grounds.match.result.publish-timeout=${MATCH_RESULT_PUBLISH_TIMEOUT:2s}

# The writer's consumer of MATCH_RESULTS (core only). The stream and this
# service's hub user are provisioned by grounds-pulumi; the user and password
# travel in NATS_URL.
grounds.match.result.consumer.enabled=${MATCH_RESULT_CONSUMER_ENABLED:false}
grounds.match.result.consumer.stream=${MATCH_RESULT_CONSUMER_STREAM:MATCH_RESULTS}
grounds.match.result.consumer.durable=${MATCH_RESULT_CONSUMER_DURABLE:match-writer}
grounds.match.result.consumer.poll-interval=${MATCH_RESULT_CONSUMER_POLL_INTERVAL:1s}
grounds.match.result.consumer.batch-size=${MATCH_RESULT_CONSUMER_BATCH_SIZE:50}
grounds.match.result.consumer.retry-delay=${MATCH_RESULT_CONSUMER_RETRY_DELAY:5s}

# OpenTelemetry — the match trace (`matchmaking <mode>` with its `allocate` and
# `push` steps, continued by the game server) and a span per incoming call,
# exported over OTLP/HTTP to the satellite's Alloy, which forwards to Tempo.
# Off unless the deployment turns it on: nothing sets OTEL_SDK_DISABLED for us,
# so a deployment that wants traces sets OTEL_SDK_DISABLED=false and points
# OTEL_EXPORTER_OTLP_ENDPOINT at an OTLP receiver. Off, no traceparent is
# stored or pushed; the timeline metrics and headers do not depend on it.
quarkus.application.name=service-match
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://alloy.observability.svc.cluster.local:4318}
quarkus.otel.exporter.otlp.traces.protocol=${OTEL_EXPORTER_OTLP_PROTOCOL:http/protobuf}

# OpenAPI. The snapshot is written to build/generated/openapi at build time and
# published to groundsgg/api-reference from the release workflow — that file, not
# a live /q/openapi fetch, is what the reference site serves.
#
# auto-add-security is off because the scheme is declared once on
# OpenApiConfiguration and required per resource; letting SmallRye infer it as
# well produces two competing declarations. Swagger UI stays off: this API has no
# human callers, and the endpoint would be reachable without a token.
quarkus.smallrye-openapi.info-title=Match API
quarkus.smallrye-openapi.store-schema-directory=build/generated/openapi
quarkus.smallrye-openapi.store-schema-file-name=openapi
quarkus.smallrye-openapi.auto-add-security=false
quarkus.swagger-ui.enable=false
