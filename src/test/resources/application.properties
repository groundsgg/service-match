quarkus.flyway.migrate-at-start=true
quarkus.scheduler.enabled=false

# No kubelet projects a ServiceAccount token into a test JVM, so there is no
# credential any caller could present and nothing to verify it against. The
# filter is exercised directly instead — see WorkloadAuthFilterTest.
grounds.auth.enabled=false

# Never the real CDN from a test: nothing listens here, so a read fails fast and a test that needs
# a pool mocks PinnedMapPool or serves its own.
grounds.match.maps.cdn-base=http://127.0.0.1:9
