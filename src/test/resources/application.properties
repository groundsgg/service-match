quarkus.grpc.clients.player-presence.host=localhost
quarkus.grpc.clients.player-presence.port=9001
quarkus.grpc.clients.player-presence.plain-text=true

quarkus.flyway.migrate-at-start=true
quarkus.scheduler.enabled=false

# No kubelet projects a ServiceAccount token into a test JVM, so there is no
# credential any caller could present and nothing to verify it against. The
# filter and the interceptor are exercised directly instead — see
# WorkloadAuthFilterTest.
grounds.auth.enabled=false
