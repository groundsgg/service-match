version: 2
updates:
  # Monitor Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      # One PR for the shared Quarkus version in gradle/libs.versions.toml.
      # Separate plugin and BOM bumps fail the build.
      quarkus:
        patterns:
          - "io.quarkus"
          - "io.quarkus:io.quarkus.gradle.plugin"
          - "io.quarkus.platform:quarkus-bom"
  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
