name: Native Images

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - Dockerfile.native
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/**
      - src/**
      - ci/**
      - .github/workflows/native-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  native:
    uses: groundsgg/.github/.github/workflows/native-gradle-build-push.yml@ef77655dc378b9d509a7f7cf320c204ab098eee5
    with:
      verify-command: python3 ci/verify-native.py
    secrets: inherit
