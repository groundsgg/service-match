name: Native Images

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - Dockerfile.native
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/**
      - src/**
      - ci/**
      - .github/workflows/native-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  native:
    uses: groundsgg/.github/.github/workflows/native-gradle-build-push.yml@90644b9eaf9c7ae6fcc3d8af87854e2822f1d320
    with:
      verify-command: python3 ci/verify-native.py
    secrets: inherit
